# EnOcean EEP Platform Mapping
#
# This file maps EnOcean Equipment Profiles (EEP) to Home Assistant entities.
#
# value_template: Optional Jinja2 template to transform raw field values
#   Available variables:
#     - value: The raw field value extracted from the packet
#     - value_parsed: Full parsed packet data (dict with all fields)
#   Examples:
#     - "{{ value | round(1) }}"  # Round to 1 decimal
#     - "{{ value / 10 }}"  # Scale value
#     - \"{{ (value / 7 * 100) | round }}\"  # Battery percentage (0-7V to 0-100%)
#     - \"{{ value_parsed.TEMP if value_parsed.TEMP > 0 else 0 }}\"  # Conditional
#
# Note: MQTT-specific fields (state_topic, command_topic, payload_*, command_template)
#       are from the HA_enoceanmqtt project and shown for reference but are NOT used
#       by the native EnOcean integration. Only 'value_template' and standard HA entity
#       config (device_class, unit, icon, etc.) are processed.
#
0xD2:
  0x01:
    0x00:
      device_config:
        command: "CMD"
        channel: "CMD"
        log_learn: ""
        direction: ""
        answer: ""
      entities:
        - component: "number"
          name: "setpoint"
          config:
            min_value: 0
            max_value: 100
            unit: "%"
    0x01:
      device_config:
        command: "CMD"
        channel: "CMD"
        log_learn: ""
        direction: ""
        answer: ""
      entities:
        - component: "switch"
          name: "switch"
          config:
            state_topic: "CMD4"
            state_on: "100"
            state_off: "0"
            value_template: "{{ value_parsed.OV }}"
            command_topic: "req"
            payload_on: >
              {"CMD":"1","DV":"0","IO":"0","OV":"100","send":"clear"}
            payload_off: >
              {"CMD":"1","DV":"0","IO":"0","OV":"0","send":"clear"}
            device_class: outlet
        - component: "button"
          name: "query_status"
          config:
            command_topic: "req"
            payload_press: >-
              {"CMD":"3","IO":"30","send":"clear"}
        - component: binary_sensor
          name: "LC"
          config:
            state_topic: "CMD4"
            payload_on: "on"
            payload_off: "off"
            value_template: >-
              {% if value_parsed.LC == 1 %}on{% else %}off{% endif %}
    0x08:
      device_config:
        command: "CMD"
        channel: "CMD"
        log_learn: ""
        direction: ""
        answer: ""
      entities:
        - component: "switch"
          name: "switch"
          config:
            state_topic: "CMD4"
            state_on: "100"
            state_off: "0"
            value_template: "{{ value_parsed.OV }}"
            command_topic: "req"
            payload_on: >
              {"CMD":"1","DV":"0","IO":"0","OV":"100","send":"clear"}
            payload_off: >
              {"CMD":"1","DV":"0","IO":"0","OV":"0","send":"clear"}
            device_class: outlet
        - component: "sensor"
          name: "energy"
          config:
            state_topic: "CMD7"
            state_class: "total_increasing"
            device_class: "energy"
            unit: "Wh"
            value_template: >-
              {% if value_parsed.UN == 0 %}
                {{ (value_parsed.MV|int / 3600)|int }}
              {% elif value_parsed.UN == 1 %}
                {{ value_parsed.MV }}
              {% elif value_parsed.UN == 2 %}
                {{ value_parsed.MV|int * 1000 }}
              {% else %}
                {{ states(entity_id)|int(default=0) }}
              {% endif %}
        - component: "sensor"
          name: "power"
          config:
            state_topic: "CMD7"
            state_class: "measurement"
            device_class: "power"
            unit: "W"
            value_template: >-
              {% if value_parsed.UN == 3 %}
                {{ value_parsed.MV }}
              {% elif value_parsed.UN == 4 %}
                {{ value_parsed.MV|int * 1000 }}
              {% else %}
                {{ states(entity_id)|int(default=0) }}
              {% endif %}
        - component: "button"
          name: "query_energy"
          config:
            command_topic: "req"
            payload_press: >-
              {"CMD":"6","qu":"0","IO":"30","send":"clear"}
        - component: "button"
          name: "query_power"
          config:
            command_topic: "req"
            payload_press: >-
              {"CMD":"6","qu":"1","IO":"30","send":"clear"}
        - component: "button"
          name: "query_status"
          config:
            command_topic: "req"
            payload_press: >-
              {"CMD":"3","IO":"30","send":"clear"}
        - component: "switch"
          name: "reset_meas"
          config:
            command_topic: "__trash"
            icon: "mdi:numeric-0-circle-outline"
        - component: "select"
          name: "meas_type"
          config:
            options:
              - "Query only - Energy in Ws"
              - "Query only - Energy in Wh"
              - "Query only - Energy in KWh"
              - "Query only - Power in W"
              - "Query only - Power in KW"
              - "Query & Auto - Energy in Ws"
              - "Query & Auto - Energy in Wh"
              - "Query & Auto - Energy in KWh"
              - "Query & Auto - Power in W"
              - "Query & Auto - Power in KW"
            command_topic: "__trash"
            icon: "mdi:tune"
        - component: "number"
          name: "meas_MAT"
          config:
            command_topic: "__trash"
            min: "10"
            max: "2550"
            step: "10"
            mode: "box"
            unit: "s"
            icon: "mdi:timer-refresh-outline"
        - component: "number"
          name: "meas_MIT"
          config:
            command_topic: "__trash"
            min: "1"
            max: "255"
            step: "1"
            mode: "box"
            unit: "s"
            icon: "mdi:timer-refresh-outline"
        - component: "number"
          name: "meas_MD"
          config:
            command_topic: "__trash"
            min: "0"
            max: "4095"
            step: "1"
            mode: "box"
            icon: "mdi:equalizer"
        - component: "button"
          name: "set_meas"
          config:
            command_topic: "req"
            command_template: >-
              {% set ns = namespace() %}
              {% for entity in device_entities(device_id(entity_id)) %}
                {% if entity is search('meas_type',ignorecase=True) %}
                  {% if states(entity) is search ('only') %}{% set ns.RM = 0 %}{% else %}{% set ns.RM = 1 %}{% endif %}
                  {% if states(entity) is search ('Energy') %}{% set ns.ep = 0 %}{% else %}{% set ns.ep = 1 %}{% endif %}
                  {% if states(entity) is search ('KWh') %}{% set ns.UN = 2 %}
                  {% elif states(entity) is search (' KW') %}{% set ns.UN = 4 %}
                  {% elif states(entity) is search (' Wh') %}{% set ns.UN = 1 %}
                  {% elif states(entity) is search (' Ws') %}{% set ns.UN = 0 %}
                  {% else %}{% set ns.UN = 3 %}
                  {% endif %}
                {% elif entity is search('reset_meas',ignorecase=True) %}
                  {% if is_state(entity, "on") %}{% set ns.RE = 1 %}{% else %}{% set ns.RE = 0 %}{% endif %}
                {% elif entity is search('meas_mat',ignorecase=True) %}
                  {% set ns.MAT = (states(entity)|int /10)|int(default=10) %}
                {% elif entity is search('meas_mit',ignorecase=True) %}
                  {% set ns.MIT = states(entity)|int(default=1) %}
                {% elif entity is search('meas_md',ignorecase=True) %}
                  {% set ns.MD_MSB = (states(entity)|int/16)|int(default=0) %}
                  {% set ns.MD_LSB = (states(entity)|int%16)|int(default=0) %}
                {% endif %}
              {% endfor %}
              {"CMD":"5","RM":"{{ns.RM}}","RE":"{{ns.RE}}","ep":"{{ns.ep}}","IO":"0","MD_LSB":"{{ns.MD_LSB}}","UN":"{{ns.UN}}","MD_MSB":"{{ns.MD_MSB}}","MAT":"{{ns.MAT}}","MIT":"{{ns.MIT}}", "send":"clear"}
            icon: "mdi:download"
        - component: binary_sensor
          name: "OC"
          config:
            state_topic: "CMD4"
            payload_on: "on"
            payload_off: "off"
            value_template: >-
              {% if value_parsed.OC == 1 %}on{% else %}off{% endif %}
        - component: binary_sensor
          name: "LC"
          config:
            state_topic: "CMD4"
            payload_on: "on"
            payload_off: "off"
            value_template: >-
              {% if value_parsed.LC == 1 %}on{% else %}off{% endif %}
    0x12:
      # D2-01-12: Slot-in Module with 2 channels
      # Adapted for native EnOcean integration (NOT MQTT)
      device_config:
        command: "CMD"
        channel: "IO"
        log_learn: ""
        direction: ""
        answer: ""
      entities:
        # Channel 0 light
        - component: "light"
          name: "channel_0"
          config:
            channel: 0  # Critical: tells light entity which channel to control
            command_template_on: >-
              {"CMD": 1, "DV": 0, "IO": {{channel}}, "OV": 100}
            command_template_off: >-
              {"CMD": 1, "DV": 0, "IO": {{channel}}, "OV": 0}
        # Channel 1 light
        - component: "light"
          name: "channel_1"
          config:
            channel: 1  # Critical: tells light entity which channel to control
            command_template_on: >-
              {"CMD": 1, "DV": 0, "IO": {{channel}}, "OV": 100}
            command_template_off: >-
              {"CMD": 1, "DV": 0, "IO": {{channel}}, "OV": 0}
        # Query status button (queries all channels)
        - component: "button"
          name: "query_status"
          config:
            command_template: >-
              {"CMD": 3, "IO": 30}
        # Local control binary sensor (from status response)
        - component: binary_sensor
          name: "LC"
          config:
            device_class: "connectivity"
        # Configuration fields for timer settings
        # DT1, DT2, DT3 are dim timers: users set seconds, converted to 0.5s units for device
        # Explicitly configured as number to prevent auto-generation as select with 255 options
        - component: "number"
          name: "DT1"
          config:
            entity_category: "config"
            min_value: 0
            max_value: 127.5
            step: 0.5
            unit: "s"
            icon: "mdi:timer-cog"
            command_template: >-
              {"CMD": 2, "IO": 0, "DT1": {{(value * 2) | int}}}
        - component: "number"
          name: "DT2"
          config:
            entity_category: "config"
            min_value: 0
            max_value: 127.5
            step: 0.5
            unit: "s"
            icon: "mdi:timer-cog"
            command_template: >-
              {"CMD": 2, "IO": 0, "DT2": {{(value * 2) | int}}}
        - component: "number"
          name: "DT3"
          config:
            entity_category: "config"
            min_value: 0
            max_value: 127.5
            step: 0.5
            unit: "s"
            icon: "mdi:timer-cog"
            command_template: >-
              {"CMD": 2, "IO": 0, "DT3": {{(value * 2) | int}}}
        # Override AOT/DOT auto-generation: convert from select (65k+ options) to hidden number
        # Users interact with custom preset select + custom number entities instead
        - name: "AOT"
          component: "number"
          config:
            entity_category: "diagnostic"  # Hidden from main UI
            min_value: 0
            max_value: 65535
            unit: "s"
        - name: "DOT"
          component: "number"
          config:
            entity_category: "diagnostic"  # Hidden from main UI
            min_value: 0
            max_value: 65535
            unit: "s"
        # AOT (Auto Off Timer) - User-friendly split configuration
        # Select for common presets + special values, Number for custom values
        - component: "select"
          name: "auto_off_preset_ch0"
          config:
            entity_category: "config"
            icon: "mdi:timer-off"
            options:
              - "Disabled"
              - "5 minutes"
              - "15 minutes"
              - "30 minutes"
              - "1 hour"
              - "2 hours"
              - "6 hours"
              - "12 hours"
              - "24 hours"
              - "Keep device setting"
              - "Custom (use timer value)"
            command_template: >-
              {% set values = {
                "Disabled": 0,
                "5 minutes": 300,
                "15 minutes": 900,
                "30 minutes": 1800,
                "1 hour": 3600,
                "2 hours": 7200,
                "6 hours": 21600,
                "12 hours": 43200,
                "24 hours": 86400,
                "Keep device setting": 65535
              } %}
              {% if option in values %}
              {"CMD": 11, "IO": 0, "AOT": {{ values[option] }}}
              {% else %}
              null
              {% endif %}
        - component: "number"
          name: "auto_off_custom_ch0"
          config:
            entity_category: "config"
            min_value: 1
            max_value: 65534
            unit: "s"
            icon: "mdi:timer-edit"
            command_template: >-
              {"CMD": 11, "IO": 0, "AOT": {value}}
        # DOT (Delay OFF Timer) - User-friendly split configuration
        - component: "select"
          name: "delay_off_preset_ch0"
          config:
            entity_category: "config"
            icon: "mdi:timer"
            options:
              - "Disabled"
              - "5 minutes"
              - "15 minutes"
              - "30 minutes"
              - "1 hour"
              - "2 hours"
              - "6 hours"
              - "12 hours"
              - "24 hours"
              - "Keep device setting"
              - "Custom (use timer value)"
            command_template: >-
              {% set values = {
                "Disabled": 0,
                "5 minutes": 300,
                "15 minutes": 900,
                "30 minutes": 1800,
                "1 hour": 3600,
                "2 hours": 7200,
                "6 hours": 21600,
                "12 hours": 43200,
                "24 hours": 86400,
                "Keep device setting": 65535
              } %}
              {% if option in values %}
              {"CMD": 11, "IO": 0, "DOT": {{ values[option] }}}
              {% else %}
              null
              {% endif %}
        - component: "number"
          name: "delay_off_custom_ch0"
          config:
            entity_category: "config"
            min_value: 1
            max_value: 65534
            unit: "s"
            icon: "mdi:timer-edit"
            command_template: >-
              {"CMD": 11, "IO": 0, "DOT": {value}}
        # Channel 1 timers
        - component: "select"
          name: "auto_off_preset_ch1"
          config:
            entity_category: "config"
            icon: "mdi:timer-off"
            options:
              - "Disabled"
              - "5 minutes"
              - "15 minutes"
              - "30 minutes"
              - "1 hour"
              - "2 hours"
              - "6 hours"
              - "12 hours"
              - "24 hours"
              - "Keep device setting"
              - "Custom (use timer value)"
            command_template: >-
              {% set values = {
                "Disabled": 0,
                "5 minutes": 300,
                "15 minutes": 900,
                "30 minutes": 1800,
                "1 hour": 3600,
                "2 hours": 7200,
                "6 hours": 21600,
                "12 hours": 43200,
                "24 hours": 86400,
                "Keep device setting": 65535
              } %}
              {% if option in values %}
              {"CMD": 11, "IO": 1, "AOT": {{ values[option] }}}
              {% else %}
              null
              {% endif %}
        - component: "number"
          name: "auto_off_custom_ch1"
          config:
            entity_category: "config"
            min_value: 1
            max_value: 65534
            unit: "s"
            icon: "mdi:timer-edit"
            command_template: >-
              {"CMD": 11, "IO": 1, "AOT": {value}}
        - component: "select"
          name: "delay_off_preset_ch1"
          config:
            entity_category: "config"
            icon: "mdi:timer"
            options:
              - "Disabled"
              - "5 minutes"
              - "15 minutes"
              - "30 minutes"
              - "1 hour"
              - "2 hours"
              - "6 hours"
              - "12 hours"
              - "24 hours"
              - "Keep device setting"
              - "Custom (use timer value)"
            command_template: >-
              {% set values = {
                "Disabled": 0,
                "5 minutes": 300,
                "15 minutes": 900,
                "30 minutes": 1800,
                "1 hour": 3600,
                "2 hours": 7200,
                "6 hours": 21600,
                "12 hours": 43200,
                "24 hours": 86400,
                "Keep device setting": 65535
              } %}
              {% if option in values %}
              {"CMD": 11, "IO": 1, "DOT": {{ values[option] }}}
              {% else %}
              null
              {% endif %}
        - component: "number"
          name: "delay_off_custom_ch1"
          config:
            entity_category: "config"
            min_value: 1
            max_value: 65534
            unit: "s"
            icon: "mdi:timer-edit"
            command_template: >-
              {"CMD": 11, "IO": 1, "DOT": {value}}
# Template-specific overrides can be added here (e.g., D2/0x12 for lights)
0xF6:
  # F6 (RPS) profiles are now handled dynamically from EEP.xml
  # Event entities are created automatically based on enum fields (R1, R2, WIN, PB, etc.)
  # No YAML mapping needed - remove old button/binary_sensor mappings to use EEP-based events

0xD5:
  0x00:
    0x01:
      device_config:
        command: ""
        channel: ""
        log_learn: ""
        direction: ""
        answer: ""
      entities:
        - component: binary_sensor
          name: "contact"
          config:
            device_class: "opening"
            payload_on: "0"
            payload_off: "1"

# Example: A5-04-01 Temperature and Humidity Sensor
# This profile includes temperature, humidity, and learn button fields
# Demonstrates value_template usage for different data types
0xA5:
  0x04:
    0x01:
      device_config:
        command: ""
        channel: ""
        log_learn: ""
        direction: ""
        answer: ""
      entities:
        - component: sensor
          name: "TMP"
          config:
            device_class: "temperature"
            unit: "°C"
            state_class: "measurement"
            # Example: Round temperature to 1 decimal place
            value_template: "{{ value | round(1) }}"
        - component: sensor
          name: "HUM"
          config:
            device_class: "humidity"
            unit: "%"
            state_class: "measurement"
            value_template: "{{ value | round(1) }}"
        - component: binary_sensor
          name: "LRN"
          config:
            # Learn button state (1=pressed, 0=not pressed)
            device_class: "power"

